<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>心理学12 · 一根线串起整讲：学习的分类 × 行为主义</title>
<style>
/* ============================================================
   设计系统 · Apple 2026（Liquid Glass，iOS 27 调校版）
   特征：半透明玻璃层 + 深色描边 + 高光；大圆角；系统色；大留白；
   正文不用纯黑；动效克制并尊重「减弱动态效果」。
   ============================================================ */
:root{
  --bg:#f3f4f9;
  --ink:#1d1d1f; --ink2:#3d3d44; --ink3:#6e6e76; --ink4:#9a9aa3;
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.82); --glass3:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.85); --edge:rgba(20,24,40,.09);
  --blue:#0a84ff; --indigo:#5e5ce6; --purple:#af52de; --pink:#ff2d55; --red:#ff3b30;
  --orange:#ff9500; --yellow:#ffcc00; --green:#34c759; --mint:#00c7be; --teal:#30b0c7; --cyan:#32ade6; --brown:#a2845e;
  --tint:var(--blue);
  --r:28px; --r2:18px; --r3:12px;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 16px 40px -16px rgba(20,24,40,.22);
  --shadow-sm:0 1px 1px rgba(20,24,40,.04),0 8px 22px -12px rgba(20,24,40,.16);
  --board:#fff5f3; --board-ink:#c8352a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1014; --ink:#f5f5f7; --ink2:#d9d9de; --ink3:#a1a1aa; --ink4:#6e6e76;
    --glass:rgba(34,36,44,.58); --glass2:rgba(40,42,52,.8); --glass3:rgba(34,36,44,.36);
    --line:rgba(255,255,255,.14); --edge:rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.7);
    --shadow-sm:0 1px 1px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.6);
    --board:#2a1f1e; --board-ink:#ff8a80;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  font:18px/1.85 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* 背景光斑 */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-20vmax;background:radial-gradient(circle,#9ec5ff,transparent 65%)}
.bgfx i:nth-child(2){width:55vmax;height:55vmax;right:-18vmax;top:10vmax;background:radial-gradient(circle,#ffc2d4,transparent 65%);animation-delay:-8s}
.bgfx i:nth-child(3){width:50vmax;height:50vmax;left:20vmax;bottom:-25vmax;background:radial-gradient(circle,#b9f3e4,transparent 65%);animation-delay:-16s}
@media (prefers-color-scheme:dark){.bgfx i{opacity:.28}}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}

.wrap{max-width:900px;margin:0 auto;padding:0 20px 140px}

/* 玻璃 */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px var(--edge)}
@media (prefers-color-scheme:dark){.glass{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--edge)}}

/* 顶栏 */
.topbar{position:sticky;top:12px;z-index:50;margin:12px auto 0;max-width:900px;padding:0 12px}
.topbar .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.topbar .bar::-webkit-scrollbar{display:none}
.topbar .brand{font-weight:800;font-size:14px;white-space:nowrap;padding:6px 12px;color:var(--ink2);letter-spacing:.02em}
.topbar a{flex:none;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;padding:7px 13px;border-radius:999px;transition:background .25s,color .25s}
.topbar a:hover{background:rgba(120,130,160,.12)}
.topbar a.on{background:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){.topbar a.on{background:#fff;color:#000}}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));z-index:60;transition:width .15s linear}

/* 封面 */
.hero{margin:44px 0 28px;padding:56px 48px 44px;position:relative;overflow:hidden}
.hero .kicker{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--tint);text-transform:uppercase}
.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.15;letter-spacing:-.03em;font-weight:800;margin:14px 0 18px}
.hero h1 em{font-style:normal;background:linear-gradient(92deg,var(--blue),var(--purple) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:19px;color:var(--ink2);max-width:640px}
.hero .lede b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:rgba(10,132,255,.1);color:#2f6fd0;border:1px solid rgba(10,132,255,.16)}
@media (prefers-color-scheme:dark){.chip{color:#8ab8ff}}

/* 通用排版 */
h2.ch{font-size:clamp(28px,4.6vw,40px);line-height:1.2;letter-spacing:-.025em;font-weight:800;margin:0 0 6px}
h3{font-size:24px;letter-spacing:-.015em;font-weight:800;margin:44px 0 12px;line-height:1.3}
h4{font-size:19px;font-weight:800;margin:26px 0 8px;letter-spacing:-.01em}
p{margin:10px 0;color:var(--ink2)}
p b,li b{color:var(--ink);font-weight:700}
.lead{font-size:20px;color:var(--ink);line-height:1.75}
ul,ol{padding-left:1.35em;color:var(--ink2)}
li{margin:6px 0}
mark{background:linear-gradient(transparent 55%,rgba(255,204,0,.55) 55%);color:inherit;padding:0 2px;border-radius:3px}
.k{font-weight:800;color:var(--tint)}
.term{font-weight:800;color:var(--ink);border-bottom:2px solid color-mix(in srgb,var(--tint) 45%,transparent)}
.muted{color:var(--ink3);font-size:15.5px}
.tiny{font-size:14px;color:var(--ink3)}
hr.sp{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:40px 0}

/* 章节 */
section.chapter{margin-top:76px;--tint:var(--blue)}
.chhead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.chhead .num{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:.14em;color:var(--tint)}
.chhead .num i{width:26px;height:2px;background:var(--tint);border-radius:2px;display:inline-block}
.chhead .sub{font-size:18px;color:var(--ink3)}
.scene{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:34px 36px}
.scene .pic{display:flex;justify-content:center}
.scene svg{width:100%;max-width:360px;height:auto}
@media (max-width:720px){.scene{grid-template-columns:1fr}.scene .pic{order:-1}.hero{padding:40px 24px 34px}}
.card{padding:28px 32px;margin:22px 0}
@media (max-width:600px){.card{padding:22px 20px}}
.card.tight{padding:20px 24px}

/* 一句话卡 */
.one{font-size:clamp(20px,3vw,25px);font-weight:800;line-height:1.45;letter-spacing:-.015em;padding:22px 28px;border-radius:var(--r2);
  background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 14%,transparent),color-mix(in srgb,var(--tint) 4%,transparent));
  border:1px solid color-mix(in srgb,var(--tint) 22%,transparent);margin:18px 0}
.one small{display:block;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--tint);margin-bottom:6px}

/* 比方 / 钩子 / 板书 / 原话 */
.fig{display:flex;gap:14px;padding:18px 22px;border-radius:var(--r2);background:var(--glass3);border:1px solid var(--line);margin:16px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.fig .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--tint) 16%,transparent)}
.fig .tt{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--tint);margin-bottom:2px}
.fig p{margin:4px 0}
.hook{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin:8px 6px 8px 0;box-shadow:var(--shadow-sm)}
.hook small{font-weight:600;opacity:.7;font-size:12.5px;letter-spacing:.1em}
@media (prefers-color-scheme:dark){.hook{background:#fff;color:#000}}
.board{position:relative;margin:18px 0;padding:18px 22px 16px 22px;border-radius:var(--r2);background:var(--board);border:1px dashed rgba(200,53,42,.35)}
.board::before{content:"老师板书";position:absolute;top:-11px;left:18px;font-size:12px;font-weight:800;letter-spacing:.14em;padding:2px 10px;border-radius:999px;background:var(--board-ink);color:#fff}
.board p{color:var(--ink2);margin:4px 0}
.board .hw{font-family:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif CJK SC",serif;font-size:19px;color:var(--board-ink);font-weight:700}
.quote{margin:18px 0;padding:16px 22px 16px 26px;border-left:3px solid var(--tint);border-radius:0 var(--r2) var(--r2) 0;background:var(--glass3);color:var(--ink2);font-size:17px}
.quote b{color:var(--ink)}
.quote .who{display:block;font-size:13px;color:var(--ink3);margin-top:6px;letter-spacing:.06em}

/* 双栏对比 */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.vs>div{padding:18px 20px;border-radius:var(--r2);background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.vs h5{font-size:17px;font-weight:800;margin-bottom:6px;color:var(--tint)}
.vs p{font-size:16.5px;margin:4px 0}
.vs.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:760px){.vs.three{grid-template-columns:1fr}}

/* 表 */
table.t{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;font-size:16px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:var(--glass2);box-shadow:var(--shadow-sm)}
table.t th{text-align:left;font-size:13.5px;letter-spacing:.06em;color:var(--ink3);padding:12px 14px;background:color-mix(in srgb,var(--tint) 9%,transparent);border-bottom:1px solid var(--edge)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--edge);vertical-align:top;color:var(--ink2)}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{font-weight:700;color:var(--ink)}
.t .ok{color:var(--green);font-weight:800}.t .no{color:var(--red);font-weight:800}
@media (max-width:640px){table.t{font-size:14.5px}table.t td,table.t th{padding:10px}}

/* 揭示（先想再看） */
.rv{margin:14px 0;border-radius:var(--r2);border:1px solid var(--line);background:var(--glass2);overflow:hidden;box-shadow:var(--shadow-sm)}
.rv>button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;cursor:pointer;padding:14px 20px;font-weight:700;color:var(--ink);font-size:16.5px}
.rv>button::after{content:"看答案";font-size:13px;font-weight:700;color:var(--tint);padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--tint) 12%,transparent);flex:none;margin-left:12px}
.rv.open>button::after{content:"收起"}
.rv .body{display:none;padding:0 20px 16px;color:var(--ink2);border-top:1px solid var(--edge)}
.rv .body p{margin:8px 0}
.rv.open .body{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 题目 */
.q{margin:18px 0;padding:22px 24px;border-radius:var(--r);background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow)}
.q .tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint);margin-right:6px}
.q .tag.real{background:rgba(255,45,85,.12);color:#d81b4b}
.q .stem{font-size:17px;color:var(--ink);margin:10px 0 12px;font-weight:600;line-height:1.7}
.q .opts{display:grid;gap:8px}
.q .opts button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass3);font-size:16px;color:var(--ink2);line-height:1.55;transition:transform .15s,background .2s}
.q .opts button:hover{background:color-mix(in srgb,var(--tint) 8%,transparent)}
.q .opts button b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){.q .opts button b{background:#fff;color:#000}}
.q.done .opts button{cursor:default}
.q .opts button.right{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.5)}
.q .opts button.right b{background:var(--green)}
.q .opts button.wrong{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.45)}
.q .opts button.wrong b{background:var(--red)}
.q .why{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--edge)}
.q.done .why{display:block;animation:fade .3s ease}
.q .why .ans{font-weight:800;color:var(--ink);margin-bottom:6px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{position:relative;padding-left:38px;margin:8px 0;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);font-weight:800;font-size:13.5px;display:grid;place-items:center}
.q .tf .opts{grid-template-columns:1fr 1fr}

/* 步进器（巴甫洛夫） */
.stepper{margin:16px 0;padding:20px 22px;border-radius:var(--r);background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow)}
.stepper .row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 10px;border-radius:14px;opacity:.28;transition:opacity .35s,background .35s}
.stepper .row.on{opacity:1;background:color-mix(in srgb,var(--tint) 8%,transparent)}
.stepper .row .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
@media (prefers-color-scheme:dark){.stepper .row .n{background:#fff;color:#000}}
.stepper .row .f{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:16px}
.stepper .row .lab{font-size:15px;font-weight:800;text-align:right;color:var(--ink)}
.lbl{display:inline-block;padding:2px 9px;border-radius:8px;font-size:13.5px;font-weight:800;vertical-align:middle}
.lbl.u{background:rgba(255,204,0,.35);color:#6b5300}.lbl.neu{background:rgba(120,130,160,.18);color:var(--ink3)}.lbl.c{background:rgba(10,132,255,.16);color:#1e6fd9}.lbl.r{background:rgba(52,199,89,.18);color:#1f8f43}
@media (prefers-color-scheme:dark){.lbl.u{color:#ffd60a}.lbl.c{color:#8ab8ff}.lbl.r{color:#6fe39a}}
.stepper .ctl{display:flex;gap:10px;margin-top:14px;align-items:center}
.btn{all:unset;cursor:pointer;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow-sm)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--edge)}
@media (prefers-color-scheme:dark){.btn{background:#fff;color:#000}.btn.ghost{background:transparent;color:#fff}}
.stepper .say{margin-top:12px;color:var(--ink2);font-size:16px;min-height:1.6em}
@media (max-width:640px){.stepper{padding:14px 12px}.stepper .row{grid-template-columns:28px 1fr;gap:8px;padding:10px 6px}.stepper .row .n{width:24px;height:24px;font-size:12px}.stepper .row .f{font-size:14px;gap:4px 6px}.stepper .row .lab{grid-column:2;text-align:left;font-size:13px;color:var(--ink3)}.lbl{font-size:12px;padding:1px 7px}}

/* 台阶（加涅八级） */
.stairs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;margin:16px 0}
.stairs div{border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 30%,transparent),color-mix(in srgb,var(--tint) 10%,transparent));border:1px solid color-mix(in srgb,var(--tint) 25%,transparent);padding:8px 4px 6px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end}
.stairs div small{font-weight:600;color:var(--ink3);font-size:11px;display:block}
@media (max-width:640px){.stairs{grid-template-columns:repeat(4,1fr);align-items:stretch}.stairs div{height:auto!important}}

/* 九宫格 / 坐标 */
.grid9{display:grid;grid-template-columns:70px repeat(3,1fr);gap:8px;margin:16px 0;font-size:14.5px}
.grid9 .h{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);text-align:center;font-size:14px}
.grid9 .c{padding:12px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.grid9 .c .ex{font-weight:800;color:var(--ink);font-size:15.5px;margin-bottom:6px}
.grid9 .c .an{font-size:13.5px;color:var(--ink3);line-height:1.5}
.grid9 .c .an b{color:#c8352a}
.grid9 .c .an i{font-style:normal;color:#2f6fd0}
@media (max-width:640px){.grid9{grid-template-columns:1fr}.grid9 .h{display:none}.grid9 .c .ex::before{content:attr(data-col) " · " attr(data-row);display:block;font-size:12px;color:var(--ink3);font-weight:700;margin-bottom:2px}}
.axes{position:relative;margin:18px auto;max-width:520px}
.axes svg{width:100%;height:auto}

/* 自测清单 */
.check{list-style:none;padding:0;margin:14px 0}
.check li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);margin:8px 0;background:var(--glass3)}
.check input{margin-top:6px;width:18px;height:18px;accent-color:var(--tint);flex:none}
.check label{cursor:pointer;color:var(--ink2);font-size:16.5px}
.check li.done label{color:var(--ink4);text-decoration:line-through}

/* 地图 */
.map{padding:26px 22px 14px;margin:0 0 20px}
.map svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink)}

.map .cap{font-size:14px;color:var(--ink3);text-align:center;margin-top:8px}

/* 章末速记 */
.cheat{margin:34px 0 0;padding:26px 30px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 16%,transparent),color-mix(in srgb,var(--tint) 5%,transparent));border:1px solid color-mix(in srgb,var(--tint) 26%,transparent)}
.cheat h4{margin-top:0;font-size:17px;letter-spacing:.1em;color:var(--tint)}
.cheat li{color:var(--ink)}

/* 小组件 */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint);vertical-align:middle}
.arrow{color:var(--ink3)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;font-weight:700}
.flow span{padding:8px 14px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:15.5px}
.flow i{font-style:normal;color:var(--ink4)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
footer{margin-top:80px;text-align:center;color:var(--ink3);font-size:14px}
.hw{font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",serif}
</style>
</head>
<body>
